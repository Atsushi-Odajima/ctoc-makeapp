<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DayNet — Design Preview</title><link rel="stylesheet" href="style.css"><body><div class="app"><header class="top"><img src="../assets/logo_horizontal.svg" class="wordmark" alt="DayNet"><div class="toptools"><button class="iconbutton" aria-label="検索" data-notice="検索は実装時に有効になります"><img src="../assets/icons/search.svg" class="icon" alt=""></button><button class="iconbutton" aria-label="お知らせ" data-notice="デザイン確認用の画面です"><img src="../assets/icons/bell.svg" class="icon" alt=""></button></div></header><main></main><nav class="nav" aria-label="メインナビゲーション"><button data-go="feed" class="" aria-label="ホーム"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10H4V10m5 10v-7h6v7"/></svg><span>ホーム</span></button><button data-go="communities" class="" aria-label="集まり"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M2 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 1 1 0 6m2 4a5 5 0 0 1 4 5"/></svg><span>集まり</span></button><button data-go="create" class="add" aria-label="投稿"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></svg><span>投稿</span></button><button data-go="messages" class="" aria-label="DM"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v13H9l-6 4z"/></svg><span>DM</span></button><button data-go="profile" class="" aria-label="自分"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>自分</span></button></nav></div><script>const views={"feed": "<div class=\"composer-entry\"><img class=\"avatar\" src=\"../assets/avatar_kirin.svg\" alt=\"きりんのアバター\"><button class=\"prompt\" data-go=\"create\">今日は、どんな日？</button><button class=\"coral-small\" data-go=\"create\" aria-label=\"新しい投稿\"><img src=\"../assets/icons/plus.svg\" class=\"icon\" alt=\"\"></button></div><div class=\"tabs\"><button class=\"selected\" data-notice=\"フォロー中の投稿の表示例です\">フォロー中</button><button data-go=\"communities\">参加中</button><button data-notice=\"みつける画面は実装指示書に記載しています\">みつける</button></div><div class=\"date-line\"><span class=\"meta\">TODAY / 10.07 WED</span></div><article class=\"post\"><div class=\"post-head\"><img class=\"avatar\" src=\"../assets/avatar_kirin.svg\" alt=\"きりんのアバター\"><div class=\"person\">きりん<small>12分前 · 散歩、たまに寄り道。</small></div><button class=\"iconbutton\" aria-label=\"投稿メニュー\" data-notice=\"準備中の画面です\"><img src=\"../assets/icons/more.svg\" class=\"icon\" alt=\"\"></button></div><img class=\"photo\" src=\"../assets/demo_walk.png\" alt=\"散歩で見つけた花屋のオレンジと紫の花\"><p class=\"caption\">帰り道に、ちょっと遠回り。<br>気づいたら秋の色が増えていた。</p><div class=\"reacts\"><button data-react aria-pressed=\"false\" aria-label=\"いいね\"><img src=\"../assets/icons/heart.svg\" class=\"icon\" alt=\"\"><span>12</span></button><button data-react aria-pressed=\"false\"><img src=\"../assets/icons/empathy.svg\" class=\"icon\" alt=\"\"><span>気持ちわかる 8</span></button><button data-notice=\"投稿詳細は本番実装で開きます\" aria-label=\"コメント3件\"><img src=\"../assets/icons/message.svg\" class=\"icon\" alt=\"\"><span>3</span></button><button class=\"save\" data-react aria-pressed=\"false\" aria-label=\"保存\"><img src=\"../assets/icons/bookmark.svg\" class=\"icon\" alt=\"\"></button></div><div class=\"reply\"><b>なつ</b> この色の組み合わせ、いいですね。</div></article><article class=\"post\"><div class=\"post-head\"><img class=\"avatar\" src=\"../assets/avatar_natsu.svg\" alt=\"なつのアバター\"><div class=\"person\">なつ<small>30分前 · 日記</small></div></div><p class=\"caption\">いつもと違う道を歩いてみたら、<br>気になっていたパン屋を発見。</p></article>", "profile": "<section class=\"profile-hero\"><img class=\"graphic\" src=\"../assets/logo_mark.svg\" alt=\"\"><div class=\"profile-id\"><img class=\"avatar\" src=\"../assets/avatar_kirin.svg\" alt=\"きりんのアバター\"><div><h1>きりん</h1><p>@kirin_days</p></div></div><p class=\"profile-bio\">写真と、散歩と、たまに喫茶店。<br>見つけたものを少しずつ。</p><dl class=\"profile-facts\"><div class=\"fact\"><i class=\"dot\"></i><div><dt>イキリポイント</dt><dd>喫茶店の引き出しが多い</dd></div></div><div class=\"fact\"><i class=\"dot\"></i><div><dt>残念な弱点</dt><dd>朝にめっぽう弱い</dd></div></div><div class=\"fact\"><i class=\"dot\"></i><div><dt>趣味3つ</dt><dd class=\"hobbies\"><span>写真</span><span>散歩</span><span>喫茶店</span></dd></div></div></dl></section><div class=\"page\"><div class=\"stats\"><span><b>48</b>投稿</span><span><b>62</b>フォロー</span><span><b>81</b>フォロワー</span></div><div class=\"profile-actions\"><button class=\"primary\" data-notice=\"プロフィール編集は実装指示書に記載しています\">プロフィールを編集</button><button class=\"secondary\" data-notice=\"デザイン見本のため共有リンクはありません\" aria-label=\"プロフィール共有\"><img src=\"../assets/icons/share.svg\" class=\"icon\" alt=\"\"></button></div><div class=\"profile-tabs\"><button class=\"selected\">投稿</button><button data-notice=\"日記だけの一覧へ切り替える仕様です\">日記</button><button data-go=\"communities\">集まり</button></div><div class=\"grid\"><img src=\"../assets/demo_walk.png\" alt=\"花屋の写真\"><div class=\"note-tile\"><span class=\"meta\">NOTE / 10.04</span><span>予定のない<br>日曜日。</span><span>日記を読む →</span></div></div><p class=\"sibling\">DayNetとCinemiXは、同じ系列のアプリです。</p></div>", "communities": "<div class=\"page\"><div class=\"intro\"><div><p class=\"overline\">YOUR CIRCLES</p><h1>好きなことから、話そう。</h1></div></div><input class=\"search\" placeholder=\"集まりを探す\" aria-label=\"集まりを探す\"><div class=\"section\"><h2>参加している集まり</h2><span class=\"meta\">02</span></div><article class=\"club\"><div class=\"clubtop\"><div class=\"club-symbol\"><svg viewBox=\"0 0 40 40\"><path d=\"m3 33 17-29 17 29Z\" fill=\"#EF7C68\"/><circle cx=\"21\" cy=\"25\" r=\"10\" fill=\"#302B38\"/></svg></div><div><h2>散歩、たまに寄り道。</h2><span class=\"meta muted\">WALK & FIND</span></div></div><p>いつもの道も、初めての道も。<br>散歩で見つけた一枚を持ち寄ろう。</p><div class=\"club-info\"><span>64人が参加 · 新しい投稿 3件</span><button class=\"linkbtn\" data-go=\"feed\">のぞいてみる →</button></div></article><article class=\"club\"><div class=\"clubtop\"><div class=\"club-symbol\" style=\"background:#F8D5CC\"><svg viewBox=\"0 0 40 40\"><path d=\"M6 6h22v22H6z\" fill=\"#302B38\"/><circle cx=\"27\" cy=\"27\" r=\"12\" fill=\"#EF7C68\"/></svg></div><div><h2>喫茶とひとやすみ</h2><span class=\"meta muted\">COFFEE & TALK</span></div></div><p>よかった席、おいしかったおやつ。<br>今日はどこでひとやすみ？</p><div class=\"club-info\"><span>128人が参加 · 新しい投稿 2件</span><button class=\"linkbtn\" data-go=\"feed\">のぞいてみる →</button></div></article><button class=\"secondary\" style=\"width:100%;margin-top:17px\" data-notice=\"集まり作成は本番アプリに実装します\">新しい集まりをつくる</button></div>", "create": "<div class=\"page\"><div class=\"create-head\"><h1>今日のひとコマ</h1><button class=\"primary accentbtn\" data-notice=\"デザイン見本のため投稿されません\">投稿する</button></div><textarea class=\"editor\" aria-label=\"投稿本文\" placeholder=\"見つけたもの、思ったこと。\"></textarea><div class=\"attach\"><button class=\"secondary\" data-notice=\"本番では写真と動画の選択を開きます\"><img src=\"../assets/icons/camera.svg\" class=\"icon\" alt=\"\"> 写真・動画</button><button class=\"secondary\" data-notice=\"本番では端末のカメラを開きます\"><img src=\"../assets/icons/plus.svg\" class=\"icon\" alt=\"\"> 撮影する</button></div><div class=\"upload-preview\"><img src=\"../assets/demo_walk.png\" alt=\"添付画像の見本\"></div><div class=\"row\"><span>投稿先</span><b>自分のページ</b></div><div class=\"row\"><span>公開範囲</span><b>公開</b></div><p class=\"hint\">写真は5枚まで。動画は1本・60秒まで。<br>文章だけの日記も書けます。</p></div>", "messages": "<div class=\"page\"><div class=\"intro\"><div><p class=\"overline\">MESSAGES</p><h1>話のつづき。</h1></div><button class=\"linkbtn\" data-notice=\"未承認DMは別のリクエスト一覧へ\">リクエスト</button></div><div class=\"message-person\"><img class=\"avatar\" src=\"../assets/avatar_natsu.svg\" alt=\"なつのアバター\"><div class=\"preview\"><b>なつ</b><p>その花屋さん、気になってました。</p></div><span class=\"meta\">12:42</span></div><div class=\"bubble\">写真の花屋さん、あの路地のお店ですか？</div><div class=\"bubble mine\">そうです。寄り道してみたら、<br>秋の花がいっぱいでした。</div><div class=\"bubble\">その花屋さん、気になってました。</div><div class=\"typing\"><input class=\"search\" placeholder=\"メッセージを書く\" aria-label=\"メッセージ本文\"><button class=\"primary accentbtn\" data-notice=\"デザイン見本のため送信されません\">送信</button></div><p class=\"hint\">会話と利用者名は架空の表示例です。</p></div>"};const main=document.querySelector('main');function show(s){if(!views[s])s='feed';main.innerHTML=views[s];document.querySelectorAll('nav [data-go]').forEach(b=>{b.classList.toggle('active',b.dataset.go===s);if(b.dataset.go===s)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});history.replaceState(null,'','#'+s);window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0))}function notice(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)return show(g.dataset.go);const r=e.target.closest('[data-react]');if(r){r.setAttribute('aria-pressed',r.getAttribute('aria-pressed')!=='true');return notice('デザイン見本：この変更は保存されません')}const n=e.target.closest('[data-notice]');if(n)notice(n.dataset.notice)});show(location.hash.slice(1)||'feed');</script></body></html>
